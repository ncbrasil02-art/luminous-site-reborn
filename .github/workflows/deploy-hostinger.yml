name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # prerender.js imports a .ts file directly (native TS support),
          # which needs Node 23.6+/24 — Node 20 crashes with ERR_UNKNOWN_FILE_EXTENSION.
          node-version: 24
          cache: npm

      # Lovable's own editor now manages dependencies via bun (bun.lockb) and
      # doesn't keep package-lock.json in sync, so `npm ci` breaks any time it
      # adds/changes a package. `npm install` tolerates that drift.
      - name: Install dependencies
        run: npm install

      - name: Build (static site)
        run: npm run build

      # Site is served as static prerendered HTML on Hostinger (no Node.js
      # runtime there), so only the client build is uploaded to the document
      # root (HOSTINGER_APP_PATH, e.g. public_html).
      - name: Upload dist/ to Hostinger via SSH
        uses: easingthemes/ssh-deploy@v6
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          REMOTE_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          REMOTE_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SOURCE: "dist/"
          TARGET: ${{ secrets.HOSTINGER_APP_PATH }}
          # news/ is excluded: it's a ~1GB media library that lives only on
          # the server (not in git), so --delete must not touch it.
          # server/ is excluded: it's the SSR bundle used only to generate
          # the prerendered HTML during the build — Hostinger has no Node.js
          # runtime, so shipping it would just waste ~1GB of upload per run.
          ARGS: "-rlgoDzvc -i --delete --exclude=news --exclude=server"
